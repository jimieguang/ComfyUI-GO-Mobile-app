name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Also build debug APK'
        type: boolean
        default: true
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "--- platforms ---"
          ls "${ANDROID_HOME}/platforms" | tail -6
          echo "--- build-tools ---"
          ls "${ANDROID_HOME}/build-tools" | tail -6

      - name: Build release (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Sign release APK
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: ${BT}"

          keytool -genkeypair -v -keystore "${RUNNER_TEMP}/release.jks" -alias app \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ComfyUIGO,O=Personal,C=CN"

          IN="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "input apk: ${IN}"
          test -n "${IN}"

          mkdir -p dist
          "${BT}/zipalign" -p -f 4 "${IN}" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" sign \
            --ks "${RUNNER_TEMP}/release.jks" \
            --ks-pass pass:android --key-pass pass:android \
            --out dist/app-release-signed.apk \
            "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" verify --print-certs dist/app-release-signed.apk

      - name: Collect debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        run: |
          set -euo pipefail
          mkdir -p dist
          D="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "${D}"
          cp "${D}" dist/app-debug.apk

      - name: Checksums
        run: |
          cd dist
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -la

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-go-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
