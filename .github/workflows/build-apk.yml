name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Also build debug APK'
        type: boolean
        default: true
  push:
    branches: [ main ]

permissions:
  contents: write   # 发布 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "--- platforms ---"
          ls "${ANDROID_HOME}/platforms" | tail -6
          echo "--- build-tools ---"
          ls "${ANDROID_HOME}/build-tools" | tail -6

      - name: Build release (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PversionCodeOverride=${{ github.run_number }}

      - name: Build debug
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PversionCodeOverride=${{ github.run_number }}

      - name: Sign release APK
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: ${BT}"

          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 密钥，无法使用固定签名"
            exit 1
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          export KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KS_ALIAS="${{ secrets.KEY_ALIAS }}"
          echo "使用固定签名密钥（alias=${KS_ALIAS}），保证后续版本可覆盖安装"

          IN="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "input apk: ${IN}"
          test -n "${IN}"

          mkdir -p dist
          "${BT}/zipalign" -p -f 4 "${IN}" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" sign \
            --ks "${RUNNER_TEMP}/release.jks" \
            --ks-key-alias "${KS_ALIAS}" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out dist/app-release-signed.apk \
            "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" verify --print-certs dist/app-release-signed.apk
          rm -f "${RUNNER_TEMP}/release.jks"

      - name: Collect debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_debug }}
        run: |
          set -euo pipefail
          mkdir -p dist
          D="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "${D}"
          cp "${D}" dist/app-debug.apk

      - name: Checksums
        run: |
          cd dist
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -la

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-go-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Write version manifest
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          cd dist
          VC="${{ github.run_number }}"
          # 用 python 生成 JSON：提交信息可能含引号/换行，直接用 heredoc 拼接会破坏格式
          VC="$VC" python3 - <<'PY'
          import json, os
          vc = os.environ["VC"]
          notes = (os.environ.get("COMMIT_MSG") or "手动构建").strip().splitlines()[0][:200]
          data = {
              "versionCode": int(vc),
              "versionName": f"1.0.{vc}",
              "apkAsset": "app-release-signed.apk",
              "shaAsset": "SHA256SUMS.txt",
              "notes": notes,
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
          cat version.json

      # 应用内更新从这里取：releases/latest/download/version.json
      # 必须是正式 Release（非 draft / 非 prerelease），否则 latest 不指向它
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"
          NOTES="$(printf '%s' "${COMMIT_MSG:-手动构建}" | head -n 1 | cut -c1-200)"
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "ComfyUI GO v1.0.${{ github.run_number }}" \
            --notes "${NOTES}" \
            dist/app-release-signed.apk \
            dist/SHA256SUMS.txt \
            dist/version.json
